name: Build and deploy

on:
  push:
    branches: [main]
  # Pull requests are built (to catch mistakes) but never deployed.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.166.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for "Last edited by" and Recent changes

      - name: Install Hugo
        run: |
          curl -sSL -o "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"

      - name: Make PNG copies of new SVG images for old browsers
        run: |
          missing=""
          for f in static/images/*.svg; do
            if [ -e "$f" ] && [ ! -e "$f.png" ]; then missing="$missing $f"; fi
          done
          if [ -n "$missing" ]; then
            sudo apt-get install -y librsvg2-bin
            for f in $missing; do rsvg-convert -w 256 --keep-aspect-ratio "$f" -o "$f.png"; done
          fi

      - name: Build site
        run: |
          python3 scripts/recent_changes.py
          hugo --gc
          npx --yes pagefind@1 --site public

      - name: Deploy to DreamHost
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "Deploy secrets are not all set yet; skipping deploy."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh_cmd="ssh -i $HOME/.ssh/deploy_key"
          # Safety check: never wipe a folder that still holds the old MediaWiki install.
          if $ssh_cmd "$SSH_USER@$SSH_HOST" "test -e '$DEPLOY_PATH/LocalSettings.php'"; then
            echo "::error::$DEPLOY_PATH still contains MediaWiki (LocalSettings.php). Move it out before deploying."
            exit 1
          fi
          # files/ (large downloads), editor/ and .well-known/ live only on the server, so they
          # are excluded. ik0ns/, icons/ and banners/ are uploaded from the repo, but extra files
          # already on the server are protected from deletion: Hotline clients load icons from there.
          rsync -rlvz --delete --chmod=D755,F644 \
            --exclude files/ --exclude editor/ --exclude .well-known/ \
            --filter 'P /ik0ns/***' --filter 'P /icons/***' --filter 'P /banners/***' \
            -e "$ssh_cmd" \
            public/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
